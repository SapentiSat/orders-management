<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logowanie vendor — {{ product }}</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="vendor-admin admin-login-page">
  <main class="admin-login-card">
    <p class="overline">VENDOR ONLY</p>
    <h1>Panel administracyjny</h1>
    <p class="muted">Oddzielny dostęp do wystawiania licencji. Firmy-klienci mają własny panel bez tej sekcji.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label><span>Hasło administracyjne</span>
        <input type="password" name="password" required autofocus placeholder="ADMIN_PASSWORD">
      </label>
      <button class="btn primary" type="submit">Zaloguj do admina</button>
    </form>
    <p class="muted" style="margin-top:18px;font-size:12px">Adres: <span class="mono">/admin</span> — nie linkujemy go w panelu klienta.</p>
  </main>
</body>
</html>
