services:
  ordersmanagement:
    build: .
    container_name: ordersmanagement
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      SAMPLE_MODE: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      - om_data:/app/data
    restart: unless-stopped

volumes:
  om_data:
